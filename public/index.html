<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050606" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="News" />
  <title>Nothing News</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app" class="app">
    <header class="topbar">
      <button id="brandButton" class="brand" type="button" aria-label="Главная">
        <span class="brand-dot">NOTHING</span>
        <span class="brand-plain">NEWS</span>
      </button>
      <button id="searchButton" class="circle-button" type="button" aria-label="Поиск">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="5.5"></circle><path d="M15.5 15.5 20 20"></path></svg>
      </button>
    </header>

    <section id="homeView" class="view view-active">
      <div id="categoryList" class="category-list" aria-label="Категории"></div>

      <button id="worldCard" class="home-world" type="button" aria-label="Мировая картина">
        <svg id="homeMap" class="dot-map" viewBox="0 0 320 170" aria-hidden="true"></svg>
        <span class="map-caption">РЕАЛЬНЫЕ СОБЫТИЯ<br>В ГЛОБАЛЬНОМ КОНТЕКСТЕ</span>
        <span class="round-arrow">→</span>
      </button>
    </section>

    <section id="feedView" class="view">
      <div class="feed-tabs" id="feedModeTabs">
        <button type="button" data-feed-mode="now" class="active">СЕЙЧАС</button>
        <button type="button" data-feed-mode="overview">ОБЗОР</button>
        <button type="button" data-feed-mode="mine">МОЁ</button>
      </div>
      <div id="storyList" class="story-list" aria-live="polite"></div>
    </section>

    <section id="storyView" class="view">
      <div class="story-topline">
        <button id="storyBack" class="circle-button" type="button" aria-label="Назад">←</button>
        <button id="bookmarkButton" class="circle-button" type="button" aria-label="Сохранить">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5h10v15L12 16l-5 3.5z"></path></svg>
        </button>
      </div>
      <article id="storyArticle" class="story-article"></article>
    </section>

    <section id="contextView" class="view">
      <button class="text-back" type="button" data-back="story">← НАЗАД</button>
      <div class="section-kicker">ПОЧЕМУ ЭТО ВАЖНО</div>
      <p id="contextText" class="context-copy"></p>
      <div class="section-kicker context-heading">ИСТОЧНИКИ</div>
      <div id="contextSources" class="source-list"></div>
      <div class="section-kicker context-heading">ПОХОЖИЕ ТЕМЫ</div>
      <div id="relatedTopics" class="topic-grid"></div>
    </section>

    <section id="worldView" class="view">
      <button class="text-back" type="button" data-back="home">← НАЗАД</button>
      <div class="page-title">МИР СЕЙЧАС</div>
      <div class="page-subtitle">ГЛОБАЛЬНАЯ КАРТИНА ДНЯ</div>
      <div class="world-panel">
        <svg id="worldMap" class="dot-map dot-map-wide" viewBox="0 0 360 190" aria-hidden="true"></svg>
      </div>
      <div id="cityTimes" class="city-list"></div>
      <button id="worldFeedButton" class="outline-action" type="button"><span>СМОТРЕТЬ ГЛОБАЛЬНЫЕ НОВОСТИ</span><span>→</span></button>
    </section>

    <section id="prefsView" class="view">
      <div class="page-title">ВАШИ ИНТЕРЕСЫ</div>
      <div class="page-subtitle">НАСТРОЙТЕ ЛЕНТУ ПОД СЕБЯ</div>
      <div id="preferenceSliders" class="preference-list"></div>
      <div class="reading-switch" aria-label="Стиль подачи">
        <button type="button" data-density="short">Кратко</button>
        <button type="button" data-density="balanced" class="active">Баланс</button>
        <button type="button" data-density="deep">Подробно</button>
      </div>
      <div class="profile-links">
        <button id="openDigest" type="button"><span>ДАЙДЖЕСТ ДНЯ</span><span>→</span></button>
        <button id="openCalm" type="button"><span>СПОКОЙНЫЙ РЕЖИМ</span><span>→</span></button>
      </div>
    </section>

    <section id="digestView" class="view">
      <button class="text-back" type="button" data-back="prefs">← НАЗАД</button>
      <div class="page-title">ДАЙДЖЕСТ ДНЯ</div>
      <div class="page-subtitle">8 ГЛАВНЫХ СОБЫТИЙ</div>
      <div id="digestTimeline" class="digest-timeline"></div>
      <button id="digestFeedButton" class="outline-action" type="button"><span>ОТКРЫТЬ ЛЕНТУ</span><span>→</span></button>
    </section>

    <section id="calmView" class="view">
      <button class="text-back" type="button" data-back="prefs">← НАЗАД</button>
      <div class="page-title">СПОКОЙНЫЙ РЕЖИМ</div>
      <div class="page-subtitle">ТОЛЬКО ГЛАВНОЕ. БЕЗ ШУМА.</div>
      <div class="calm-radar" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
      <p class="calm-copy">Мы оставим только небольшой набор свежих событий и уберём всё лишнее.</p>
      <button id="calmToggle" class="white-action" type="button">ВКЛЮЧИТЬ</button>
      <div id="calmList" class="calm-list" hidden></div>
    </section>

    <section id="savedView" class="view">
      <div class="page-title">СОХРАНЁННОЕ</div>
      <div class="page-subtitle">ВАШИ ЗАКЛАДКИ</div>
      <div id="savedList" class="saved-list"></div>
    </section>

    <section id="searchPanel" class="search-panel" hidden>
      <form id="searchForm" class="search-form">
        <label for="searchInput">ПОИСК</label>
        <div class="search-row">
          <input id="searchInput" type="search" placeholder="Тема, компания, человек" autocomplete="off" />
          <button type="submit" aria-label="Искать">→</button>
        </div>
      </form>
    </section>

    <nav class="bottom-nav" aria-label="Навигация">
      <button type="button" data-view="home" class="nav-active" aria-label="Главная">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 10.5 12 4l7.5 6.5v9h-5v-6h-5v6h-5z"></path></svg>
      </button>
      <button type="button" data-view="feed" aria-label="Лента">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="7" r="1.5"></circle><circle cx="12" cy="7" r="1.5"></circle><circle cx="17" cy="7" r="1.5"></circle><circle cx="7" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="17" cy="12" r="1.5"></circle><circle cx="7" cy="17" r="1.5"></circle><circle cx="12" cy="17" r="1.5"></circle><circle cx="17" cy="17" r="1.5"></circle></svg>
      </button>
      <button type="button" data-view="saved" aria-label="Сохранённое">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5h10v15L12 16l-5 3.5z"></path></svg>
      </button>
      <button type="button" data-view="prefs" aria-label="Профиль и интересы">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"></circle><path d="M5.5 19c.8-3.2 3-5 6.5-5s5.7 1.8 6.5 5"></path></svg>
      </button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
